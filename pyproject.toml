[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dollforge"
version = "0.1.0"
description = "Local, reviewable multi-view doll engineering pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1", "typer>=0.15,<1", "Pillow>=11,<13",
  "numpy>=2.2,<3", "scipy>=1.15,<2", "scikit-image>=0.25,<1",
  "trimesh>=4.6,<5", "structlog>=25,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[project.scripts]
dollforge = "dollforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dollforge = ["web/*", "workers/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["blender: runs the real Blender executable"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
